name: Deploy

# Build the site + the two bilingual print editions, render them to PDF with
# headless Chrome (CJK + emoji fonts installed), publish everything to GitHub
# Pages, and — on a v* tag — attach the PDFs to a GitHub Release.
#
# One-time setup by the repo owner: Settings -> Pages -> Build and deployment
# -> Source: GitHub Actions. (This workflow only deploys; it cannot create the
# Pages site itself.)

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # attach PDFs to a Release on tags
  pages: write      # deploy to Pages
  id-token: write   # required by deploy-pages

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build site and bilingual print editions
        run: |
          cd src
          python build.py
          python build_print.py

      - name: Install CJK + emoji fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Render bilingual PDFs
        run: |
          CHROME="${{ steps.chrome.outputs.chrome-path }}"
          for lang in zh en; do
            "$CHROME" --headless=new --no-sandbox --disable-gpu \
              --no-pdf-header-footer \
              --print-to-pdf="generic-agent-visual-guide-$lang.pdf" \
              --virtual-time-budget=30000 \
              "file://$PWD/print-$lang.html"
          done
          ls -la generic-agent-visual-guide-*.pdf

      - name: Assemble Pages site
        run: |
          mkdir -p _site/lessons
          cp index.html _site/
          cp -r lessons/. _site/lessons/
          cp generic-agent-visual-guide-zh.pdf generic-agent-visual-guide-en.pdf _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Upload PDFs as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: generic-agent-visual-guide-*.pdf

      - name: Attach PDFs to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: generic-agent-visual-guide-*.pdf

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
